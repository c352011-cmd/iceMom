<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Grid</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="melt-filter" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.006 0.0096"
          numOctaves="2"
          seed="7"
          result="melt-noise"
        />
        <feDisplacementMap
          in="SourceGraphic"
          in2="melt-noise"
          scale="0"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>
    <!--
  각 칸의 .collage 에 data-images="경로1, 경로2, ..." 를 넣으면
  collage.js가 자동으로 <img class="collage-img">를 만들어 랜덤 위치/크기/각도로
  배치하고, 중력으로 떨어져 바닥에 쌓이게 합니다. data-label 은 칸 안에 표시될
  라벨 텍스트입니다(비워두면 라벨 없이 이미지만).
  cell-detail 블록(닫기 버튼/타이틀/바디)은 절대 지우면 안 됩니다 —
  main.js가 모든 .cell 안에서 이 블록을 찾아 이벤트를 붙이기 때문에,
  하나라도 없으면 전체 클릭 인터랙션이 깨집니다.
-->

    <div id="stage">
      <div id="canvas-wrapper">
        <div id="canvas">
          <div class="col col-left">
            <section class="cell cell-green" data-screen="green">

                <div class="detail-body"></div>
